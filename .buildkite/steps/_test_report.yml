agents:
  queue: "default-debian-amd64"

label: ":bar_chart: Aggregate test report"
key: "full-test-report"

command: "true"

allow_dependency_failure: true

depends_on:

plugins:
  - bureau14/qdb-test-report#sc-19015/buildkite-test-report:
      title: "Full test report"
      # Volume of tests is too big - 20k test * 48 variants = ~1M test results, over 150mb html report, we report only failed tests
      only_failures: true
      aggregate:
        variants:
