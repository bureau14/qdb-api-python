agents:
  queue: "{queue}"

retry:
  automatic:
      limit: 3

label: "{name} ({slug})"
step_id: build

commands:
  - echo \"+++ Start Services\"
  - bash scripts/tests/setup/start-services.sh
  - echo \"+++ Run Tests\"
  - bash scripts/cicd/20.test.sh
  - echo \"+++ Run build\"
  - bash scripts/cicd/10.build.sh

plugins:
  - bureau14/qdb-artifacts#67c0599e1c2ce7537eba8bb87baa2f9c0d447e90:
      download:
        clean: true
        projects:
          - project_id: "quasardb-build"
            # sc-20192 test branch only (step-id proof I3): pin quasardb-build
            # to the step-id branch.
            git_ref: "refs/heads/sc-20192/step-ids"
            step: build
            output-dir: "qdb"
            extract: true
            files:
              - "*-c-api.tar.zst!*"
              - "*-server.tar.zst!*"
              - "*-utils.tar.zst!*"
          # sc-20192 test branch only: a snapshot dependency on qdb-api-rest,
          # so that a build of this pipeline is the root of a chain three
          # deep. Download only, into a directory the build does not use.
          - project_id: "qdb-api-rest"
            output-dir: "snapdep-rest"
            files:
              - "*-rest.*"
          # sc-20192 test branch only (step-id proof I6, I9b): qdb-api-rest's
          # freebsd-haswell-release, so that a dependent asks rest for FreeBSD.
          # Download only, into a directory the build does not use.
          - project_id: "qdb-api-rest"
            variant: "freebsd-haswell-release"
            output-dir: "sc20192-rest-freebsd"
            files:
              - "*-rest.*"
      upload:
        files:
          - "dist/quasardb-*.whl"
          - "dist/doc.tar.gz"
        base_dir: "dist"
      promote: {}
  - bureau14/qdb-test-report#master:
      title: "Test report {slug}"
      job:
        variant: {slug}
        junit_input_path: "tests/build/test/*.xml"
