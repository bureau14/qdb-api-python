# Snapshot dependencies (sc-20192): the direct dependencies of this
# repository's pipelines on other pipelines, one entry per project_id
# that the qdb-artifacts download blocks in steps/ name. The same content
# on every release line.
schema: 1
lines: [master, 3.14.x]
pipelines:
  qdb-api-python:
    depends:
      - project: quasardb-build
        repo: bureau14/quasardb
      # sc-20192 test branch only, until the planned dependency lands.
      - project: qdb-api-rest
        repo: bureau14/qdb-api-rest
    # sc-20192 test branch only: the reduced matrix of pipeline.py.
    gates:
      - build-linux-core2-release-py312
      - build-linux-aarch64-release-py312
    produces:
      - linux-core2-release-py312
      - linux-aarch64-release-py312
